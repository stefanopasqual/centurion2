<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081321">
<title>CENTURION2 — Hangar 3D</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#07111f;color:#e5f4ff}
*{box-sizing:border-box}body{margin:0;overflow:hidden}header{height:58px;display:flex;gap:12px;align-items:center;padding:10px 14px;background:#0b1b2c;border-bottom:1px solid #234761}header b{letter-spacing:.09em;font-size:14px}header small{color:#9eb8cb;font-size:11px}
button{background:#193b57;color:#edf9ff;border:1px solid #4782a5;padding:9px 12px;border-radius:9px;cursor:pointer;min-height:39px;font:600 12px system-ui}
button:hover,button:focus-visible{background:#235579}button:disabled{opacity:.6;cursor:wait}
main{height:calc(100dvh - 58px);display:grid;grid-template-columns:210px minmax(0,1fr)}nav{padding:12px;background:#081a2a;overflow:auto;border-right:1px solid #234761}nav button{width:100%;text-align:left;margin-bottom:7px;border-color:#2b526e}nav button.active{background:#19719a;border-color:#7dd9ff}nav button small{display:block;color:#a9c2d5;margin-top:4px}
#stage{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}#view{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#1d3e57,#07111f 75%)}#view canvas{display:block;width:100%;height:100%;touch-action:none}
#status{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;font-size:12px;color:#c5e2f7;text-shadow:0 1px 5px #000}
#floor{position:absolute;bottom:15px;left:15px;opacity:.7;font-size:11px;pointer-events:none}
footer{padding:11px 14px;background:#0b1b2c;border-top:1px solid #28455f;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}footer h1{margin:0 0 4px;font-size:17px}footer p{color:#a8c5d9;margin:0;font-size:12px}#credit{font-size:11px;color:#d9bf8b}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}#upload{display:none}
@media(max-width:700px){header{height:53px;gap:6px}main{height:calc(100dvh - 53px);display:flex;flex-direction:column}nav{display:flex;flex:none;gap:6px;overflow-x:auto;overflow-y:hidden;padding:7px;border-right:0;border-bottom:1px solid #234761}nav button{min-width:110px;width:auto;margin:0;white-space:nowrap}#stage{flex:1}footer{grid-template-columns:1fr;padding:10px;gap:9px}.actions{justify-content:start}button{min-height:40px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body>
<header><button id="back">← Indietro</button><div><b>CENTURION2 · HANGAR 3D</b><br><small>MODELLI REALISTICI · ASSET ORIGINALI</small></div></header>
<main><nav id="aircraft"></nav><div id="stage"><div id="view"><div id="status">Caricamento…</div><div id="floor">Ruota trascinando · Zoom con due dita o rotellina</div></div><footer><div><h1 id="title">Eurofighter Typhoon</h1><p id="credit">Modelli di bohmerang, Sketchfab — CC BY-NC-SA 4.0</p><p id="hint">Importa un file GLB convertito dal sorgente Blender originale.</p></div><div class="actions"><button id="import">Importa GLB</button><button id="reset">Centra</button><button id="source">Modello originale</button><input type="file" id="upload" accept=".glb,model/gltf-binary"></div></footer></div></main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {apply51Stormo} from './livrea51.js';
const MODELS=[
{id:'f22',name:'Lockheed Martin F-22 Raptor',tag:'F-22',url:'https://sketchfab.com/3d-models/f22-raptor-ec44bd6cffa649b4927799a7b19c703b'},
{id:'typhoon',name:'Eurofighter Typhoon · 51° Stormo Istrana',tag:'EF-2000',url:'https://sketchfab.com/3d-models/eurofighter-typhoon-fighter-jet-free-992bcc8987964ca09d55410330aa8579'},
{id:'f15e',name:'F-15E Strike Eagle',tag:'F-15E',url:'https://sketchfab.com/3d-models/f-15e-strike-eagle-fighter-jet-free-fff7d75490474e9b964d90cc031c8d01'},
{id:'su57',name:'Sukhoi Su-57',tag:'Su-57',url:'https://sketchfab.com/3d-models/sukhoi-su-57-felon-p-fighter-jet-free-31127bc63bc048debb694aa88bbaafae'},
{id:'su35',name:'Sukhoi Su-35S',tag:'Su-35',url:'https://sketchfab.com/3d-models/sukhoi-su-35-fighter-jet-free-3213a404e5cb4fb68f778b9acae5109c'},
{id:'ea18',name:'Boeing EA-18G Growler',tag:'EA-18G',url:'https://sketchfab.com/3d-models/mcdonnell-douglas-fa-18eboeing-ea-18g-growler-d69153c8e91744cab2bad239a2cb5d98'},
{id:'weapons',name:'Missili e bombe',tag:'ARMAMENTI',url:'https://sketchfab.com/3d-models/missile-bomb-collection-fighter-jets-free-d203b678424a43568703bf85ba680f47'},
{id:'uav-fixed',name:'UAV da ricognizione ad ala fissa',tag:'UAV · FIXED',url:'',drone:'fixed',summary:'Ricognitore originale non armato, ali rastremate, ottica orientabile ed elica animata.'},
{id:'uav-quad',name:'Drone quadricottero ISR',tag:'UAV · QUAD',url:'',drone:'quad',summary:'Multirotore originale non armato con quattro rotori, carrello ed ottica stabilizzata.'},
{id:'geran2',name:'Geran-2 (Shahed-136) · drone ostile',tag:'GERAN-2',url:'https://sketchfab.com/3d-models/geranium-2-8f12f601efe44a73b47e30a7077cf249',info:'Drone ostile delle missioni M12–M15 (Donbass e Zaporižžja) · apertura alare 2,5 m, lunghezza 3,5 m'}];
const CREDITI={f22:'sxnneh / Sketchfab — Sketchfab Standard',ea18:'Rhine_Lab_Muelsyse / Sketchfab — CC BY 4.0',geran2:'Karosio / Sketchfab — CC BY-NC-SA 4.0'};
const $=s=>document.querySelector(s),view=$('#view'),status=$('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07111f);
const camera=new THREE.PerspectiveCamera(40,1,0.05,2000);camera.position.set(16,10,18);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=THREE.SRGBColorSpace;view.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9ebff,0x243344,2));const key=new THREE.DirectionalLight(0xfff4dc,3);key.position.set(-10,20,10);scene.add(key);
const rim=new THREE.DirectionalLight(0x80c6ff,1.3);rim.position.set(10,5,-12);scene.add(rim);
const grid=new THREE.GridHelper(60,30,0x2f526b,0x17334a);grid.position.y=-5.5;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=180;
const loader=new GLTFLoader();let selected=MODELS[0],aircraft=null,token=0,animationDriver=null,procedural=false,droneLoad=null,livery51=null;
async function ensureDroneFactory(){
 if(window.CENTURION_REALISM?.drone)return window.CENTURION_REALISM;
 if(!droneLoad){
   window.THREE=THREE;
   droneLoad=new Promise((resolve,reject)=>{
     const script=document.createElement('script');
     script.src='../js/realism.js';
     script.onload=()=>window.CENTURION_REALISM?.drone?
       resolve(window.CENTURION_REALISM):reject(new Error('Generatore UAV non disponibile'));
     script.onerror=()=>reject(new Error('Impossibile caricare i modelli UAV condivisi'));
     document.head.appendChild(script);
   });
 }
 return droneLoad;
}
function note(t){status.textContent=t;}
function clear(){
 if(livery51){livery51.dispose();livery51=null;}
 document.getElementById('sketchfab-fallback')?.remove();
 $('#floor').style.display='';
 $('#floor').textContent='Ruota trascinando · Zoom con due dita o rotellina';
 if(aircraft){
   if(procedural)aircraft.traverse(o=>{if(o.isMesh&&o.geometry)o.geometry.dispose();});
   scene.remove(aircraft);aircraft=null;
 }
 animationDriver=null;procedural=false;
}
function frame(obj){const box=new THREE.Box3().setFromObject(obj);const dimensions=box.getSize(new THREE.Vector3());const largest=Math.max(dimensions.x,dimensions.y,dimensions.z);if(!largest||!Number.isFinite(largest))throw Error('Geometria non valida');obj.scale.multiplyScalar(16/largest);box.setFromObject(obj);const c=box.getCenter(new THREE.Vector3());obj.position.sub(c);camera.position.set(15,10,19);controls.target.set(0,0,0);controls.update();}
function place(glb){clear();aircraft=glb.scene;if(selected.info)$('#hint').textContent=selected.info+' · mostrato ingrandito alla stessa scala dei jet';const gearDown=[];aircraft.traverse(o=>{const n=(o.name||'').toLowerCase().replace(/[\s_.-]/g,'');if(/landingon|gearon|geardown|gearout|refuelon|landinglights|undercarriage(?!off|up)|wheel(?!off|up)|tire(?!off|up)|tyre(?!off|up)/.test(n))gearDown.push(o);});gearDown.forEach(o=>{if(o.parent)o.parent.remove(o);});scene.add(aircraft);frame(aircraft);
 if(selected.id==='typhoon'){
  try{
   livery51=apply51Stormo(THREE,scene,aircraft);
   $('#hint').textContent='Eurofighter Typhoon · livrea 51° Stormo, Istrana · insegne artistiche ispirate ai Gatti Neri';
   note(livery51.applied ? '51° Stormo di Istrana · ' + livery51.applied + ' decalcomanie applicate · carrello retratto' : 'Eurofighter originale · livrea 51° non proiettata sul modello');
  }catch(e){console.warn('Eurofighter 51 Stormo:',e);note('Eurofighter originale · livrea 51° non disponibile');}
 }else note(selected.drone?'GLB UAV importato · orbita e zoom attivi':'Modello 3D originale · carrello retratto · orbita e zoom attivi');}
function showDrone(m,created){
 if(!created?.g)throw Error('Geometria UAV mancante');
 clear();aircraft=created.g;aircraft.name=m.name;scene.add(aircraft);
 frame(aircraft);procedural=true;
 animationDriver=typeof created.animate==='function'?created.animate:null;
 $('#hint').textContent=m.summary+' Modello utilizzato anche nelle missioni Donbass.';
 $('#floor').textContent='Trascina per ruotare · Pizzica per zoom · Eliche e sensori animati';
 note('UAV procedurale originale · nessun armamento · orbita e zoom attivi');
}
async function openModel(m){const id=++token;selected=m;$('#hint').textContent='Caricamento 3D: GLB locale, file importato oppure anteprima Sketchfab.';$('#title').textContent=m.name;$('#credit').textContent=m.drone?'CENTURION2 · modello procedurale originale, non armato':(CREDITI[m.id]||'bohmerang / Sketchfab — CC BY-NC-SA 4.0');
 $('#source').onclick=m.url?()=>window.open(m.url,'_blank','noopener,noreferrer'):null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===m.id));note('Caricamento '+m.name+'…');try{let stored=null;
 try{stored=await readStored(m.id);}catch(err){console.warn('Archivio locale non accessibile',err);}
 if(id!==token)return;if(stored){const g=await loader.parseAsync(await stored.arrayBuffer(),'');if(id===token){place(g);return;}}if(m.drone){
  const factory=await ensureDroneFactory();
  if(id===token){showDrone(m,factory.drone(m.drone==='quad'));return;}
 }
 const glb=await loader.loadAsync('../models/'+m.id+'.glb');if(id===token){place(glb);return;}}catch(e){if(id!==token)return;clear();const match=m.url.match(/([0-9a-f]{32})$/i);
 if(match){
   const f=document.createElement('iframe');
   f.id='sketchfab-fallback';
   f.title='Modello originale Sketchfab: '+m.name;
   f.src='https://sketchfab.com/models/'+match[1]+'/embed?autostart=1&ui_controls=1';
   f.allow='autoplay; fullscreen; xr-spatial-tracking';
   f.setAttribute('allowfullscreen','');
   Object.assign(f.style,{position:'absolute',inset:'0',width:'100%',height:'100%',border:'0',zIndex:'1'});
   view.append(f);
   $('#floor').style.display='none';
   $('#hint').textContent='Anteprima 3D originale via Sketchfab. Per il motore di volo serve il GLB convertito.';
   note('Anteprima Sketchfab in caricamento');
 }else{
   note(m.drone?'Errore caricamento drone: '+String(e.message||e):
    'GLB non ancora disponibile sul sito. Tocca «Importa GLB» dopo aver convertito il sorgente Blender.');
 }}}
for(const m of MODELS){const b=document.createElement('button');b.dataset.id=m.id;b.innerHTML='<strong>'+m.tag+'</strong><small>'+m.name+'</small>';b.onclick=()=>openModel(m);$('#aircraft').append(b);}
function db(){return new Promise((ok,bad)=>{let r=indexedDB.open('centurion2-glb-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error);});}
async function readStored(id){const database=await db();try{return await new Promise((resolve,reject)=>{const r=database.transaction('files').objectStore('files').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}finally{database.close();}}
async function saveStored(id,file){const database=await db();try{await new Promise((resolve,reject)=>{const t=database.transaction('files','readwrite');t.objectStore('files').put(file,id);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}finally{database.close();}}
$('#import').onclick=()=>$('#upload').click();$('#upload').onchange=async()=>{const f=$('#upload').files[0];if(!f)return;try{note('Importazione '+f.name+'…');const g=await loader.parseAsync(await f.arrayBuffer(),'');place(g);await saveStored(selected.id,f);note(f.name+' · salvato localmente su questo dispositivo');}catch(e){note('Errore GLB: '+String(e.message||e));}$('#upload').value='';};
$('#reset').onclick=()=>{if(aircraft)frame(aircraft);};
$('#back').onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'centurion2-ef2000-close'},location.origin);else location.href='../';};
function resize(){let w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(view);resize();const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(.05,clock.getDelta());
 if(animationDriver)animationDriver(dt,clock.elapsedTime);
 controls.update();renderer.render(scene,camera);
});
openModel(MODELS.find(m=>m.id===new URLSearchParams(location.search).get('aircraft'))||MODELS[0]);
</script></body></html>
