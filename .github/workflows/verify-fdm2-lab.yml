name: FDM 2.0 generic rigid-body verification
on:
  push:
    branches: [research/fdm2-physics-lab]
    paths: ['physics-lab/**', '.github/workflows/verify-fdm2-lab.yml']
  pull_request:
    paths: ['physics-lab/**', '.github/workflows/verify-fdm2-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test physics-lab/test.mjs physics-lab/advanced.test.mjs physics-lab/nesc02.test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix physics-lab --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: physics-lab/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - run: node physics-lab/browser.test.mjs ${{ matrix.engine }}
