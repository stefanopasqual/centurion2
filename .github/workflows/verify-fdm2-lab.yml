name: FDM 2.0 generic rigid-body verification
on:
  push:
    branches: [research/fdm2-physics-lab]
    paths: ['physics-lab/**', '.github/workflows/verify-fdm2-lab.yml']
  pull_request:
    paths: ['physics-lab/**', '.github/workflows/verify-fdm2-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test physics-lab/test.mjs
