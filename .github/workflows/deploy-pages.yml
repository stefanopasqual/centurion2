name: Publish CENTURION2 mobile
on:
  push:
    branches: [main]
    paths:
      - 'CENTURION2_GITHUB_MOBILE.zip'
      - '.github/workflows/deploy-pages.yml'
      - '.github/ef2000/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: centurion2-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract mobile website
        run: |
          test -f CENTURION2_GITHUB_MOBILE.zip || { echo "::error::Upload CENTURION2_GITHUB_MOBILE.zip to the root of this repository"; exit 1; }
          mkdir -p extracted
          unzip -q CENTURION2_GITHUB_MOBILE.zip -d extracted
          test -f extracted/site/index.html || { echo "::error::ZIP must contain site/index.html"; exit 1; }
          test -f extracted/site/manifest.json || { echo "::error::ZIP must contain site/manifest.json"; exit 1; }
          test -f extracted/site/js/app.js || { echo "::error::ZIP must contain site/js/app.js"; exit 1; }
      - name: Integrate Eurofighter EF-2000 3D
        shell: bash
        run: |
          python3 -m pip install --user numpy trimesh
          python3 .github/ef2000/build_ef2000.py
          mkdir -p extracted/site/ef2000
          cp .github/ef2000/EF2000_*.glb extracted/site/ef2000/
          cp .github/ef2000/viewer.html extracted/site/ef2000/viewer.html
          cp .github/ef2000/launcher.js extracted/site/ef2000/launcher.js
          python3 - <<'PY'
          from pathlib import Path
          path=Path('extracted/site/index.html')
          html=path.read_text(encoding='utf-8')
          marker='<script src="ef2000/launcher.js"></script>'
          if marker not in html:
              assert '</body>' in html, "CENTURION2 source missing closing body"
              html=html.replace('</body>', marker+'\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          test -s extracted/site/ef2000/EF2000_flight_armed.glb
          test -s extracted/site/ef2000/EF2000_flight_clean.glb
          test -s extracted/site/ef2000/EF2000_gear_down.glb
      - name: Apply CENTURION2 startup password gate
        run: python3 .github/security/apply_gate.py extracted/site
      - name: Refresh offline cache version for EF2000
        run: sed -i 's/centurion2-mobile-password-v2/centurion2-mobile-ef2000-v3/g' extracted/site/sw.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
