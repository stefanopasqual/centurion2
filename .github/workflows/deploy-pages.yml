name: Publish CENTURION2 mobile
on:
  push:
    branches: [main]
    paths:
      - 'CENTURION2_GITHUB_MOBILE.zip'
      - '.github/workflows/deploy-pages.yml'
      - '.github/ef2000/**'
      - '.github/airbus/**'
      - '.github/blackhawk/**'
      - '.github/models/**'
      - '.github/maps/**'
      - '.github/cadet/**'
      - '.github/aar/**'
      - '.github/home/**'
      - '.github/commander/**'
      - '.github/mission_upgrade/**'
      - '.github/veneto/**'
      - '.github/freeflight/**'
      - '.github/cockpit/**'
      - '.github/vfx/**'
      - '.github/thermal/**'
      - '.github/ground_life/**'
      - '.github/sonic/**'
      - '.github/aero/**'
      - '.github/security/**'
      - '.github/pod/**'
      - '.github/postbruciatore/**'
      - '.github/sar/**'
      - '.github/pilot/**'
      - 'model-sources/**'
  workflow_dispatch:

# Destinazione: se i segreti CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID esistono,
# il sito va su Cloudflare Pages (privato dietro Cloudflare Access, vedi README);
# altrimenti resta su GitHub Pages, che e' PUBBLICO.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: centurion2-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract mobile website
        run: |
          test -f CENTURION2_GITHUB_MOBILE.zip || { echo "::error::Upload CENTURION2_GITHUB_MOBILE.zip to the root of this repository"; exit 1; }
          mkdir -p extracted
          unzip -q CENTURION2_GITHUB_MOBILE.zip -d extracted
          test -f extracted/site/index.html || { echo "::error::ZIP must contain site/index.html"; exit 1; }
          test -f extracted/site/manifest.json || { echo "::error::ZIP must contain site/manifest.json"; exit 1; }
          test -f extracted/site/js/app.js || { echo "::error::ZIP must contain site/js/app.js"; exit 1; }
      - name: Install Blender when original source archives are present
        shell: bash
        run: |
          if find model-sources -maxdepth 1 -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            sudo apt-get update
            sudo apt-get install -y blender python3-numpy python3-pil
            blender --background --python-exit-code 7 --python-expr 'import numpy; print("Blender numpy OK:", numpy.__version__)'
          fi
      - name: Convert licensed original aircraft for web
        shell: bash
        run: |
          mkdir -p extracted/site/models extracted/site/ef2000
          python3 .github/models/build_models.py --input-dir . --output-dir extracted/site/models --mission-dir extracted/site/modelli
          python3 .github/models/patch_site.py extracted/site
          python3 .github/cockpit/patch_cockpit.py extracted/site
          python3 .github/cockpit/patch_cockpit3d.py extracted/site
          node --check extracted/site/js/cockpit3d.js
          python3 .github/vfx/patch_vfx.py extracted/site
          node --check extracted/site/js/volo.js
          python3 .github/models/patch_render.py extracted/site
          python3 .github/freeflight/patch_freeflight.py extracted/site
          node --check extracted/site/js/volo.js
          node --check extracted/site/js/vista3d.js
          node --check extracted/site/js/mondo3d.js
          python3 .github/aar/patch_aar.py extracted/site
          node --check extracted/site/js/aar_cine.js
          python3 .github/models/patch_sam_controls.py extracted/site
          python3 .github/maps/patch_maps.py extracted/site
          python3 .github/cadet/patch_cadet.py extracted/site
          python3 .github/mission_upgrade/patch_donbass.py extracted/site
          python3 .github/mission_upgrade/patch_drone_missions.py extracted/site
          python3 .github/mission_upgrade/patch_drone_engine.py extracted/site
          cp .github/mission_upgrade/realism.js extracted/site/js/realism.js
          cp .github/mission_upgrade/znpp.js extracted/site/js/znpp.js
          python3 - <<'PY'
          from pathlib import Path
          index=Path('extracted/site/index.html')
          text=index.read_text(encoding='utf-8')
          marker='<script src="js/mondo3d.js"></script>'
          assert marker in text, "Mondo3D script must be present"
          plant='<script src="js/znpp.js"></script>'
          if plant not in text:
              text=text.replace(marker,plant+'\n'+marker,1)
          realism='<script src="js/realism.js"></script>'
          if realism not in text:
              text=text.replace(marker,realism+'\n'+marker,1)
              index.write_text(text,encoding='utf-8')
          PY
          node --check extracted/site/js/realism.js
          node --check extracted/site/js/znpp.js
          python3 .github/mission_upgrade/patch_visuals.py extracted/site
          python3 .github/mission_upgrade/patch_drone_runtime.py extracted/site
          python3 .github/mission_upgrade/patch_geran.py extracted/site
          cp .github/maps/terrain_mobile.js extracted/site/js/terrain_mobile.js
          python3 .github/maps/patch_mobile_quality.py extracted/site
          python3 -m py_compile .github/maps/patch_mobile_quality.py
          node --check extracted/site/js/terrain_mobile.js
          node --check extracted/site/js/volo.js
          node --check extracted/site/js/vista3d.js
          node --check extracted/site/js/mondo3d.js
          node --check extracted/site/js/map.js
          node --check extracted/site/js/geran.js
          python3 .github/veneto/patch_veneto.py extracted/site
          node --check extracted/site/js/veneto.js
          node --check extracted/site/js/veneto_cine.js
          cp .github/thermal/thermal_camera.js extracted/site/js/thermal_camera.js
          python3 .github/thermal/patch_thermal.py extracted/site
          python3 -m py_compile .github/thermal/patch_thermal.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('extracted/site/index.html')
          page=path.read_text(encoding='utf-8')
          tag='<script src="js/thermal_camera.js"></script>'
          anchor='<script src="js/volo.js"></script>'
          assert anchor in page, 'Volo script loader not found'
          if tag not in page:
              page=page.replace(anchor,tag+'\n'+anchor,1)
              path.write_text(page,encoding='utf-8')
          PY
          node --check extracted/site/js/thermal_camera.js
          cp .github/sonic/sonic_fx.js extracted/site/js/sonic_fx.js
          python3 .github/sonic/patch_sonic.py extracted/site
          node --check .github/aero/aero_core.js
          node .github/aero/test_aero.cjs
          cp .github/aero/aero_core.js extracted/site/js/aero_core.js
          python3 - <<'PY'
          from pathlib import Path
          file=Path('extracted/site/index.html')
          page=file.read_text(encoding='utf-8')
          tag='<script src="js/aero_core.js"></script>'
          anchor='<script src="js/volo.js"></script>'
          assert anchor in page
          if tag not in page:
              page=page.replace(anchor,tag+'\n'+anchor,1)
              file.write_text(page,encoding='utf-8')
          PY
          python3 .github/aero/patch_aero.py extracted/site
          node --check .github/aero/fdm6.js
          node .github/aero/test_fdm6.cjs
          cp .github/aero/fdm6.js extracted/site/js/fdm6.js
          python3 .github/aero/patch_fdm6.py extracted/site
          python3 -m py_compile .github/aero/patch_fdm6.py
          python3 - <<'PY'
          from pathlib import Path
          file=Path('extracted/site/index.html')
          page=file.read_text(encoding='utf-8')
          tag='<script src="js/fdm6.js"></script>'
          anchor='<script src="js/volo.js"></script>'
          assert anchor in page
          if tag not in page:
              page=page.replace(anchor,tag+'\n'+anchor,1)
              file.write_text(page,encoding='utf-8')
          PY
          node --check extracted/site/js/fdm6.js
          node --check extracted/site/js/aero_core.js
          python3 -m py_compile .github/aero/patch_aero.py
          python3 -m py_compile .github/sonic/patch_sonic.py
          python3 - <<'PY'
          from pathlib import Path
          file=Path('extracted/site/index.html')
          text=file.read_text(encoding='utf-8')
          tag='<script src="js/sonic_fx.js"></script>'
          anchor='<script src="js/volo.js"></script>'
          assert anchor in text
          if tag not in text:
              text=text.replace(anchor,tag+'\n'+anchor,1)
              file.write_text(text,encoding='utf-8')
          PY
          node --check extracted/site/js/sonic_fx.js
          cp .github/ground_life/gun_audio.js extracted/site/js/gun_audio.js
          cp .github/ground_life/ground_life.js extracted/site/js/ground_life.js
          python3 .github/ground_life/patch_ground_life.py extracted/site
          python3 .github/maps/patch_freeflight_ultra.py extracted/site
          python3 -m py_compile .github/maps/patch_freeflight_ultra.py
          python3 -m py_compile .github/ground_life/patch_ground_life.py
          node --check extracted/site/js/terrain_mobile.js
          python3 - <<'PY'
          from pathlib import Path
          free=Path('extracted/site/js/volo.js').read_text(encoding='utf-8')
          terrain=Path('extracted/site/js/terrain_mobile.js').read_text(encoding='utf-8')
          life=Path('extracted/site/js/ground_life.js').read_text(encoding='utf-8')
          assert 'quality:"maximum"' in free
          assert 'altitudeAGL:' in free
          assert 'velocity?velocity.x:0' in free
          assert '[isLow?16:17' in terrain
          assert 'const z=Math.min(15,entry.z)' in terrain
          assert 'const tile=tiles.get(k)' in terrain
          assert 'const count=high?' in life
          print("PASS: Free Flight zoom-17 satellite, actual zoom<=15 DEM, flight prefetch and civil detail")
          PY
          python3 - <<'PY'
          from pathlib import Path
          path=Path('extracted/site/index.html')
          html=path.read_text(encoding='utf-8')
          anchor='<script src="js/volo.js"></script>'
          assert anchor in html,'Free Flight loader missing'
          for js in ('gun_audio.js','ground_life.js'):
              tag=f'<script src="js/{js}"></script>'
              if tag not in html:
                  html=html.replace(anchor,tag+'\n'+anchor,1)
          path.write_text(html,encoding='utf-8')
          PY
          node --check extracted/site/js/gun_audio.js
          node --check extracted/site/js/ground_life.js
          node --check extracted/site/js/volo.js
          node --check extracted/site/js/mondo3d.js
          python3 - <<'PY'
          from pathlib import Path
          v=Path('extracted/site/js/volo.js').read_text()
          m=Path('extracted/site/js/mondo3d.js').read_text()
          assert 'S.gunAudio.update(' in v
          assert 'S.gunLive=!!fuoco' in v
          assert 'S.groundLife.update(' in v
          assert 'st.groundLife.update(' in m
          print('PASS: armed-aircraft cannon audio and civilian world animation integrated')
          PY
          node --check extracted/site/js/volo.js
          node --check extracted/site/js/modelli3d.js
          node --check extracted/site/js/engine.js
          node --check extracted/site/js/map.js
          node --check extracted/site/js/missioni.js
          node --check extracted/site/js/mondo3d.js
          python3 .github/home/patch_home.py extracted/site
          python3 .github/commander/patch_commander.py extracted/site
          node --check extracted/site/js/commander_core.js
          node --check extracted/site/js/commander_commander.js
          python3 -m py_compile .github/commander/patch_commander.py
          node --check extracted/site/js/home_hub.js
          node --check extracted/site/js/cadet_core.js
          node --check extracted/site/js/cadet.js
          python3 .github/cadet/patch_accademia.py extracted/site
          python3 -m py_compile .github/cadet/patch_accademia.py
          node --check extracted/site/js/accademia.js
          node --check extracted/site/js/volo.js
          python3 .github/pod/patch_pod_armi.py extracted/site
          python3 -m py_compile .github/pod/patch_pod_armi.py
          node --check extracted/site/js/pod.js
          cp .github/ef2000/viewer.html extracted/site/ef2000/viewer.html
          cp .github/ef2000/livrea51.js extracted/site/ef2000/livrea51.js
          cp .github/ef2000/airbus_local.js extracted/site/ef2000/airbus_local.js
          node --check extracted/site/ef2000/airbus_local.js
          test -s extracted/site/ef2000/livrea51.js
          node --check extracted/site/ef2000/livrea51.js
          cp .github/ef2000/launcher.js extracted/site/ef2000/launcher.js
          cp .github/ef2000/home.js extracted/site/ef2000/home.js
          python3 .github/airbus/patch_a380.py extracted/site
          # Independent CENTURION Black Hawk; the Michał Sketchfab embed remains untouched.
          python3 .github/blackhawk/consolidate_uh60m.py extracted/site/models/uh60-centurion.glb
          python3 .github/blackhawk/publish_uh60.py extracted/site
          cp .github/blackhawk/heli_fdm.js extracted/site/js/heli_fdm.js
          python3 .github/blackhawk/patch_rotor.py extracted/site
          node --check extracted/site/js/heli_fdm.js
          node --check extracted/site/js/volo.js
          node .github/blackhawk/test_heli.cjs
          python3 -m py_compile .github/blackhawk/patch_rotor.py
          python3 -m py_compile .github/blackhawk/build_uh60.py .github/blackhawk/publish_uh60.py
          python3 -m py_compile .github/airbus/patch_a380.py
          node --check extracted/site/js/a380.js
          node --check extracted/site/js/volo.js
          node --check extracted/site/js/vista3d.js
          node --check extracted/site/js/aero_core.js
          node --check extracted/site/ef2000/livrea51.js
          python3 - <<'PY'
          from pathlib import Path
          path=Path('extracted/site/index.html')
          html=path.read_text(encoding='utf-8')
          marker='<script src="ef2000/launcher.js"></script>'
          home='<script src="ef2000/home.js"></script>'
          if marker not in html:
              assert '</body>' in html, 'CENTURION2 source missing closing body'
              html=html.replace('</body>', marker+'\n</body>', 1)
          if home not in html:
              html=html.replace('</body>', home+'\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          test -s extracted/site/ef2000/viewer.html
          python3 - <<'PY'
          from pathlib import Path
          page=Path('extracted/site/ef2000/viewer.html').read_text(encoding='utf-8')
          assert "id:'uav-fixed'" in page, 'Fixed-wing drone missing from hangar'
          assert "id:'uav-quad'" in page, 'Quadcopter missing from hangar'
          assert "showDrone(m,created)" in page, 'Drone viewer missing'
          assert "ensureDroneFactory()" in page, 'Mission drone asset loader missing'
          assert "id:'geran2'" in page, 'Geran-2 missing from hangar'
          assert "id:'f16'" in page, 'F-16C missing from aircraft selection menu'
          assert "id:'a380'" in page, 'A380 missing from hangar selector'
          assert 'Consolida Airbus' in page, 'Airbus archive interface missing'
          assert "from './airbus_local.js'" in page, 'Airbus module not imported in hangar'
          assert Path('extracted/site/ef2000/airbus_local.js').is_file(), 'Airbus consolidation module absent'
          assert "id:'uh60'" in page, 'Michał Sketchfab Black Hawk preview missing'
          assert "id:'uh60-centurion'" in page, 'Original CENTURION UH-60 missing'
          volo=Path('extracted/site/js/volo.js').read_text(encoding='utf-8')
          assert 'UH60:{nome:' in volo, 'UH-60 rotorcraft not selectable in free flight'
          assert 'CENTURION_HELI_FDM.step' in volo, 'UH-60 rotor physics not connected'
          assert Path('extracted/site/js/heli_fdm.js').is_file(), 'UH60 physics script missing'
          assert 'A380:{nome:' in Path('extracted/site/js/volo.js').read_text(), 'A380 missing from free flight'
          # Browser Three.js import map script is a module. Check the complete script
          # without requiring CDN modules during a Node syntax-only build.
          start=page.index('<script type="module">')+len('<script type="module">')
          end=page.index('</script>',start)
          Path('/tmp/centurion-hangar-check.mjs').write_text(page[start:end],encoding='utf-8')
          print('PASS: Drone hangar entries and shared asset loader present')
          PY
          node --check /tmp/centurion-hangar-check.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('extracted/site/models/manifest.json').read_text())
          m=json.loads(Path('extracted/site/modelli/manifest.json').read_text())
          for model in h['models']:
              if model['status'] == 'ready':
                  p=Path('extracted/site') / model['glb']
                  assert p.is_file() and p.stat().st_size > 10000, p
          for code, cfg in m.items():
              p=Path('extracted/site/modelli') / cfg['file']
              assert p.is_file() and p.stat().st_size > 10000, p
          assert any(v['id']=='f16' and v['status']=='ready' for v in h['models']), 'F-16 absent from hangar'
          assert 'F16' in m, 'F-16 absent from mission manifest'
          # Regression guard: all seven verified source axes must face nose +Z, top +Y.
          # Angles are XYZ degrees from the source GLB metadata/mesh verification.
          expected_rotations={
              'F16':[0,180,0], 'F22':[0,180,0], 'F15':[0,-90,0], 'F2000':[0,-90,0],
              'SU57':[0,-90,0], 'SU35':[0,-90,0], 'EA18':[0,-90,0]
          }
          if Path('model-sources/geran2.glb').is_file():
              expected_rotations['GERAN2']=[0,180,0]
          for aircraft, rotation in expected_rotations.items():
              assert aircraft in m, f'{aircraft} missing from mission'
              assert m[aircraft].get('rot') == rotation, f'{aircraft} crooked chase orientation: {m[aircraft].get("rot")} != {rotation}'
          print(f'PASS: {len(expected_rotations)} model axis calibrations preserved (nose +Z / up +Y)')
          print('Hangar models:',len([v for v in h['models'] if v['status']=='ready']))
          print('Mission aircraft:', sorted(m))
          expected={'typhoon':'F2000','f15e':'F15','su57':'SU57','ea18':'EA18','f22':'F22'}
          present={p.name for p in Path('model-sources').glob('*.zip')} if Path('model-sources').exists() else set()
          if present:
              for code, mission_code in expected.items():
                  # modelli forniti come GLB singolo: se il file non è ancora nel repository si usa il modello procedurale
                  glb_opzionali={'ea18':('model-sources/ea18.glb','EA-18G'),'f22':('model-sources/f22.glb','F-22')}
                  if code in glb_opzionali and not Path(glb_opzionali[code][0]).is_file():
                      print(f'::warning::{glb_opzionali[code][1]} GLB not yet uploaded; using procedural {mission_code} fallback')
                      continue
                  rec=next(x for x in h['models'] if x['id']==code)
                  assert rec['status']=='ready', f'Original source present but model not converted: {code}'
                  assert mission_code in m, f'Mission aircraft not mapped: {mission_code}'
              print('PASS: all original mission jets converted')
          else:
              print('::warning::Original jet source archives absent: missions still use procedural fallback')
          PY
      - name: Realistic afterburner flames on every jet nozzle
        run: |
          # fiamma volumetrica (nucleo, involucro, diamanti d'urto), bagliore dell'ugello e alone su ogni ugello misurato
          python3 .github/postbruciatore/patch_postbruciatore.py extracted/site
          python3 -m py_compile .github/postbruciatore/patch_postbruciatore.py
          node --check extracted/site/js/postbruciatore.js
          node --check extracted/site/js/vista3d.js
          node --check extracted/site/js/modelli3d.js
          node --check extracted/site/js/volo.js
          grep -q 'src="js/postbruciatore.js"' extracted/site/index.html
      - name: Personnel Recovery mission with the STOS (academy)
        run: |
          # missione dell'Accademia: elicottero di recupero, team STOS Pararescue, filmati di schianto e recupero
          python3 .github/sar/patch_sar.py extracted/site
          python3 -m py_compile .github/sar/patch_sar.py
          node --check extracted/site/js/soccorso.js
          node --check extracted/site/js/volo.js
          node --check extracted/site/js/accademia.js
          grep -q 'src="js/soccorso.js"' extracted/site/index.html
      - name: Install the owner-supplied animated pilot
        run: |
          python3 .github/pilot/publish_pilot.py extracted/site
          python3 -m py_compile .github/pilot/publish_pilot.py .github/pilot/static_pilot.py
          node --check extracted/site/js/pilota3d.js
          node --check extracted/site/js/csar_zagros.js
          node --check extracted/site/js/soccorso.js
          node .github/pilot/test_pilot.cjs extracted/site
          node .github/pilot/test_hangar.cjs extracted/site
      - name: Refresh offline cache for 3D hangar
        run: |
          # Force a fresh offline cache for the cinematic model and scene assets.
          sed -i 's/centurion2-mobile-password-v2/centurion2-mobile-cadet-v24/g; s/centurion2-mobile-hangar-v4/centurion2-mobile-f22-home-v7/g; s/centurion2-mobile-hangar-su35-v5/centurion2-mobile-f22-home-v7/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-cadet-v24/centurion2-mobile-drone-ops-v26/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-drone-ops-v26/centurion2-mobile-hangar-uav-v27/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-hangar-uav-v27/centurion2-mobile-all-flight-v28/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-all-flight-v28/centurion2-mobile-hd-terrain-v29/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-hd-terrain-v29/centurion2-mobile-thermal-uav-v30/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-thermal-uav-v30/centurion2-mobile-sonic-v31/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-sonic-v31/centurion2-mobile-aero-v32/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-aero-v32/centurion2-mobile-fdm6-v33/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-fdm6-v33/centurion2-mobile-uav-ir-fix-v34/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-uav-ir-fix-v34/centurion2-mobile-uav-no-nvg-v35/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-uav-no-nvg-v35/centurion2-mobile-groundlife-guns-v36/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-groundlife-guns-v36/centurion2-mobile-freeflight-ultra-v37/g' extracted/site/sw.js
          sed -i 's/centurion2-mobile-freeflight-ultra-v37/centurion2-mobile-accademia-v38/g' extracted/site/sw.js
          # manifest.json (modelli, audio) network-first: rotations and files change on every deploy
          sed -i 's|const isDati = url => /|const isDati = url => !/manifest[.]json/.test(url) \&\& /|' extracted/site/sw.js
          grep -q 'isDati = url => !/manifest\[\.\]json/.test(url) && /' extracted/site/sw.js
      - name: Compress GLB textures for phones (and keep files under 25 MiB)
        shell: bash
        run: |
          # Every GLB above 2 MB: WebP textures, max 2048 px. 4096 px PNG textures
          # (Typhoon, EA-18G) cost ~250 MB of GPU memory and stall or crash phones.
          big=$(find extracted/site -type f -name '*.glb' -size +2M)
          if [ -n "$big" ]; then
            npm install --no-save --no-audit --no-fund @gltf-transform/cli@4
            for f in $big; do
              if [ "$f" = "extracted/site/assets/pilota.glb" ]; then
                echo "Skipping texture conversion for the pilot (no embedded textures)"
                continue
              fi
              case "$f" in
                *.glb)
                  echo "Compressing textures (WebP, max 2048 px): $f ($(du -h "$f" | cut -f1))"
                  npx gltf-transform resize "$f" "$f" --width 2048 --height 2048
                  npx gltf-transform webp "$f" "$f"
                  echo "  -> $(du -h "$f" | cut -f1)" ;;
              esac
            done
          fi
          still=$(find extracted/site -type f -size +24M)
          if [ -n "$still" ]; then
            echo "::error::Files above the 25 MiB limit:"; ls -l $still; exit 1
          fi
      - name: Version the offline cache from the cache-first files
        shell: bash
        run: |
          # sw.js serve modelli, audio e immagini in cache-first, nella cache VERSIONE + "-dati":
          # finché VERSIONE non cambia, chi ha già aperto l'app non riceve i file aggiornati.
          # Le sostituzioni "centurion2-mobile-..." del passo «Refresh offline cache» non trovano
          # più nulla (sw.js dichiara VERSIONE = "centurion-v17"): qui la versione prende
          # l'impronta dei file in cache-first, calcolata dopo la compressione dei GLB, e cambia
          # solo quando questi cambiano davvero.
          cd extracted/site
          impronta=$(find modelli audio assets js css ef2000 -type f 2>/dev/null | LC_ALL=C sort | xargs -r -d '\n' sha256sum | sha256sum | cut -c1-10)
          grep -q "^const VERSIONE = \".*-${impronta}\";" sw.js || sed -i -E "s/^const VERSIONE = \"([^\"]+)\";/const VERSIONE = \"\1-${impronta}\";/" sw.js
          grep -q "^const VERSIONE = \".*-${impronta}\";" sw.js || { echo "::error::sw.js: VERSIONE non trovata, la cache offline non verrebbe aggiornata"; exit 1; }
          grep -m1 "^const VERSIONE" sw.js
      - name: Add browser login screen when encrypted hosting is not configured
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            python3 .github/security/apply_gate.py extracted/site
            node --check extracted/site/security/access-lock.js
          else
            echo "SITE_PASSWORD configured: encrypted password login takes precedence"
          fi
      - name: Encrypt the published site (password in the SITE_PASSWORD secret)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_CHIUSO: ${{ vars.SITE_CHIUSO }}
        run: |
          # Con il segreto SITE_PASSWORD tutti i file escono cifrati (AES-256-GCM, chiave da PBKDF2);
          # senza, il sito resta in chiaro; con la variabile SITE_CHIUSO = 1 si pubblica solo
          # «accesso chiuso». Vedi «Sito cifrato» nel README.
          node --check .github/security/sw_cifrato.js
          node --check .github/security/sw_chiuso.js
          node .github/security/cifra_sito.mjs extracted/site
      - name: Choose hosting
        id: target
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo target=cloudflare >> "$GITHUB_OUTPUT"
          else echo target=github >> "$GITHUB_OUTPUT"; echo "::warning::Cloudflare secrets missing: publishing on PUBLIC GitHub Pages"; fi
      - name: Deploy to Cloudflare Pages (private behind Cloudflare Access)
        if: steps.target.outputs.target == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create centurion2 --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy extracted/site --project-name=centurion2 --branch=main --commit-dirty=true
      - name: Upload GitHub Pages artifact
        if: steps.target.outputs.target == 'github'
        uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/site

  github-pages:
    needs: deploy
    if: needs.deploy.outputs.target == 'github'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4


