name: Verify Donbass UAV and Scramble patches
on:
  push:
    branches: [main]
    paths:
      - '.github/mission_upgrade/**'
      - '.github/workflows/verify-mission-upgrade.yml'
      - 'CENTURION2_GITHUB_MOBILE.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile all drone mission patches and exercise actual ZIP source
        shell: bash
        run: |
          python3 -m py_compile .github/mission_upgrade/*.py
          mkdir -p /tmp/centurion-check
          unzip -q CENTURION2_GITHUB_MOBILE.zip "site/index.html" "site/js/*.js" -d /tmp/centurion-check
          python3 .github/maps/patch_maps.py /tmp/centurion-check/site
          python3 .github/mission_upgrade/patch_donbass.py /tmp/centurion-check/site
          python3 .github/mission_upgrade/patch_drone_missions.py /tmp/centurion-check/site
          python3 .github/mission_upgrade/patch_drone_engine.py /tmp/centurion-check/site
          python3 .github/mission_upgrade/patch_visuals.py /tmp/centurion-check/site
          python3 .github/mission_upgrade/patch_drone_runtime.py /tmp/centurion-check/site
          python3 .github/mission_upgrade/patch_geran.py /tmp/centurion-check/site
          cp .github/mission_upgrade/realism.js /tmp/centurion-check/site/js/realism.js
          cp .github/mission_upgrade/znpp.js /tmp/centurion-check/site/js/znpp.js
          for js in missioni mondo3d engine map realism znpp geran; do
            node --check "/tmp/centurion-check/site/js/$js.js"
          done
          python3 - <<'PY'
          from pathlib import Path
          js=Path("/tmp/centurion-check/site/js")
          m=(js/"missioni.js").read_text()
          w=(js/"mondo3d.js").read_text()
          e=(js/"engine.js").read_text()
          mp=(js/"map.js").read_text()
          for id in ["M12","M13","M14","M15"]:
              assert id in m,id+" mission missing"
          assert "47.94,36.48" in m
          assert "34.40" in m
          assert "sc.znpp" in m
          assert "identificaDrone(id)" in e
          assert "uav_identificati" in e
          assert "m3d-plant-focus" in w
          assert "CENTURION_PLANT.create()" in w
          assert "sc.mappa.bounds" in mp
          assert "scrambleTick(dt)" in w
          assert "GERAN-1" in m and "function geranTick(" in w and "GERAN.stato(d,this.t)" in e
          assert "js/geran.js" in Path("/tmp/centurion-check/site/index.html").read_text()
          print("PASS: 4 regional scenarios, UAV engine/UI, civilian plant, expanded map and Geran-2")
          PY
