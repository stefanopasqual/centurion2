name: Validate Airbus A380 and helicopter physics
on:
  push:
    branches: [main]
    paths:
      - '.github/blackhawk/**'
      - '.github/aero/**'
      - '.github/workflows/verify-physics.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/blackhawk/**'
      - '.github/aero/**'
      - '.github/workflows/verify-physics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and physics regression
        run: |
          node --check .github/blackhawk/heli_fdm.js
          node --check .github/blackhawk/test_heli.cjs
          node --check .github/aero/fdm6.js
          node .github/aero/test_fdm6.cjs
          node .github/blackhawk/test_heli.cjs
          node .github/blackhawk/test_pilot.cjs
          node .github/blackhawk/test_heli_edge.cjs
          python3 -m py_compile .github/blackhawk/patch_rotor.py .github/airbus/patch_a380.py
      - name: Upload virtual pilot telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uh60-virtual-test-pilot
          path: .github/blackhawk/reports/
          if-no-files-found: warn
