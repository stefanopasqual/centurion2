name: Live UH-60M Pages smoke test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-uh60-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test deployed model and site over HTTPS
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,struct,json,time,sys
          base="https://stefanopasqual.github.io/centurion2/"
          def get(p):
              url=base+p
              last=None
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Centurion2-UH60M-smoke/1"}),timeout=25) as r:
                          data=r.read()
                          print("HTTP",r.status,url,len(data),"bytes")
                          if r.status!=200:raise RuntimeError("HTTP "+str(r.status))
                          return data
                  except Exception as e:
                      last=e;print("RETRY",attempt,str(e));time.sleep(5)
              raise RuntimeError(str(last))
          page=get("index.html")
          assert b'js/volo.js' in page, "missing Free Flight entrypoint"
          for p in ("js/heli_fdm.js","js/volo.js","models/manifest.json","modelli/manifest.json"):
              data=get(p)
              if p.endswith("manifest.json"):
                  j=json.loads(data)
                  print("MANIFEST",p, json.dumps(j.get("UH60") or [x for x in j.get("models",[]) if x.get("id")=="uh60-centurion"],ensure_ascii=False))
          for p in ("models/uh60-centurion.glb","modelli/uh60-centurion.glb"):
              data=get(p)
              assert len(data)>500000,(p,len(data))
              magic,version,total=struct.unpack_from("<4sII",data)
              assert (magic,version,total)==(b"glTF",2,len(data)),(p,"bad glb header")
              length,typ=struct.unpack_from("<I4s",data,12)
              assert typ==b"JSON"
              g=json.loads(data[20:20+length])
              names={x.get("name") for x in g["nodes"]}
              assert {"CENTURION_UH60_MAIN_ROTOR","CENTURION_UH60_TAIL_ROTOR"}<=names,(p,"rotor nodes absent")
              assert len(g["meshes"])>=12
              print("PASS LIVE GLB",p,"meshes",len(g["meshes"]),"nodes",len(g["nodes"]))
          print("PASS LIVE UH60M: Pages HTML, scripts, manifests, two valid GLBs and both rotors")
          PY
      - name: Chromium browser page and network check
        shell: bash
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--disable-web-security']});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://stefanopasqual.github.io/centurion2/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(4500);
            console.log('BROWSER status',response.status(),'title',await page.title(),'url',page.url());
            console.log('BROWSER errors',JSON.stringify(errors.slice(0,10)));
            console.log('BROWSER body',JSON.stringify((await page.locator('body').innerText()).slice(0,500)));
            await page.screenshot({path:'uh60m-live-browser.png',fullPage:false});
            if(response.status()!==200)throw Error('Live page failed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uh60m-live-browser
          path: uh60m-live-browser.png
          if-no-files-found: warn
