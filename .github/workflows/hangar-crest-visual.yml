name: CENTURION2 visual QA of tail crests
on:
  push:
    paths:
      - '.github/workflows/hangar-crest-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser image tools
        run: npm install --no-save playwright-core sharp
      - name: Screenshot deployed hangar aircraft
        run: |
          cat > hangar_crest_visual.cjs <<'NODE'
          const {chromium}=require('playwright-core');
          const sharp=require('sharp');
          const fs=require('fs');
          const URL='https://stefanopasqual.github.io/centurion2/ef2000/viewer.html';
          const IDS=['f22'];
          function chunks(label,b){
            const base64=b.toString('base64');
            console.log('CONTACT_BEGIN_'+label+' '+base64.length);
            for(let i=0;i<base64.length;i+=6000)console.log('CONTACT_'+label+'_CHUNK:'+base64.slice(i,i+6000));
            console.log('CONTACT_END_'+label);
          }
          function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
          async function sheet(label,tiles){
            const W=460,H=335,columns=3,rows=Math.ceil(tiles.length/columns);
            const overlays=[];
            for(let i=0;i<tiles.length;i++){
              const x=(i%columns)*W,y=Math.floor(i/columns)*H;
              const photo=await sharp(tiles[i].buffer).resize(W-10,292,{fit:'contain',background:'#0c1828'}).jpeg({quality:67}).toBuffer();
              const svg=Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="450" height="36"><rect width="450" height="36" fill="#16273b"/><text x="9" y="23" fill="#f2f6fc" font-family="Arial" font-weight="bold" font-size="16">'+esc(tiles[i].id)+' | '+esc(tiles[i].summary.slice(0,38))+'</text></svg>');
              overlays.push({input:photo,left:x+5,top:y+3},{input:svg,left:x+5,top:y+296});
            }
            const buffer=await sharp({create:{width:W*columns,height:H*rows,channels:3,background:'#06101a'}}).composite(overlays).jpeg({quality:72}).toBuffer();
            fs.writeFileSync('/tmp/centurion-hangar-'+label+'.jpg',buffer);
            chunks(label,buffer);
          }
          (async()=>{
            const chrome=fs.existsSync('/usr/bin/google-chrome')?'/usr/bin/google-chrome':'/usr/bin/chromium-browser';
            const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu-sandbox']});
            const page=await browser.newPage({viewport:{width:1310,height:820},deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push('PAGE '+String(e).slice(0,240)));
            page.on('console',msg=>{if(msg.type()==='error')errors.push('CONSOLE '+msg.text().slice(0,180));});
            await page.waitForTimeout(1200);
          await page.goto(URL,{waitUntil:'domcontentloaded',timeout:75000});
            await page.locator('nav button[data-id="f22"]').waitFor({timeout:60000});
            const photos={front:[],side:[]},reports=[];
            for(const id of IDS){
              const b=page.locator('nav button[data-id="'+id+'"]');
              if(!await b.count()){reports.push({id,error:'Missing menu entry'});continue;}
              await b.click();
              try{
                await page.waitForFunction(()=>{
                  const s=document.querySelector('#status')?.textContent||'';
                  return s.includes('Livrea CENTURION attiva')||s.includes('Anteprima Sketchfab')||
                    s.includes('Anteprima Sketchfab in caricamento')||
                    s.includes('GLB non ancora disponibile')||
                    s.includes('Errore caricamento')||s.includes('Modello 3D originale');
                },null,{timeout:42000});
              }catch(e){console.log('MODEL_TIMEOUT '+id);}
              await page.waitForTimeout(450);
              const s=(await page.locator('#status').innerText()).trim();
              const summary=s.replace('Livrea CENTURION attiva','Livrea OK');
              reports.push({id,status:s});
              const target=page.locator('#view');
              photos.front.push({id,summary,buffer:await page.screenshot({type:'jpeg',quality:78,timeout:45000,animations:'disabled',clip:await target.boundingBox()})});
              const rect=await target.boundingBox();
              if(rect){
                const x=rect.x+rect.width*.56,y=rect.y+rect.height*.43;
                await page.mouse.move(x,y);
                await page.mouse.down();
                await page.mouse.move(x+Math.min(300,rect.width*.40),y,{steps:20});
                await page.mouse.up();
                await page.waitForTimeout(450);
              }
              photos.side.push({id,summary,buffer:await page.screenshot({type:'jpeg',quality:78,timeout:45000,animations:'disabled',clip:await target.boundingBox()})});
              console.log('MODEL_RESULT '+JSON.stringify(reports[reports.length-1]));
            }
            await sheet('front',photos.front);
            await sheet('side',photos.side);
            console.log('MODEL_REPORTS '+JSON.stringify(reports));
            console.log('BROWSER_ERRORS '+JSON.stringify(errors.slice(0,40)));
            await browser.close();
          })().catch(e=>{console.error('VISUAL_QA_FATAL '+String(e.stack||e));process.exit(1);});
          NODE
          node hangar_crest_visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hangar-crest-visual-screenshots
          path: /tmp/centurion-hangar-*.jpg
