<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b121e">
<title>CENTURION2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b121e'/%3E%3Cpath d='M32 10 52 50H12z' fill='%2353a8ff'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0b121e;color:#edf3ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
  .card{width:100%;max-width:420px;padding:30px 24px;border:1px solid #38506c;border-radius:18px;background:#172234;box-shadow:0 14px 60px #0009}
  h1{font-size:26px;letter-spacing:1px;margin:0 0 8px}
  p{line-height:1.5;color:#c0ccde}
  label{display:block;margin:18px 0 8px}
  #pw{width:100%;padding:14px;border:1px solid #7289a7;border-radius:10px;background:#101a28;color:#fff;font-size:18px}
  .vis{display:flex;align-items:center;gap:9px;font-size:14px;margin:10px 0 0}
  .vis input{width:18px;height:18px}
  button{width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:#53a8ff;color:#071525;font-weight:800;font-size:17px;cursor:pointer;min-height:48px}
  button:disabled{opacity:.6}
  #msg{min-height:1.5em;font-size:14px}
  .nota{font-size:12.5px;color:#8b98a8;margin-top:14px}
</style>
</head>
<body>
<main class="card">
  <h1>CENTURION2</h1>
  <p>Il sito è cifrato. Inserisci la password per aprirlo su questo dispositivo.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus>
    <label class="vis"><input id="mostra" type="checkbox"> Mostra password</label>
    <button id="b" type="submit">Apri</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="nota">La password non lascia il dispositivo: serve a ricavare la chiave che decifra i file nel browser. Per richiuderlo su questo dispositivo apri l'indirizzo con <b>?blocca</b> in fondo.</p>
</main>
<script>
(() => {
  "use strict";
  const f = document.getElementById("f"), pw = document.getElementById("pw"), b = document.getElementById("b"), msg = document.getElementById("msg");
  document.getElementById("mostra").addEventListener("change", e => { pw.type = e.target.checked ? "text" : "password"; });
  const ok = "serviceWorker" in navigator && window.crypto && crypto.subtle && window.indexedDB;
  if (!ok) { msg.textContent = "Questo browser non può aprire il sito cifrato: servono service worker, WebCrypto e IndexedDB (alcuni browser li disattivano in navigazione privata)."; b.disabled = true; return; }
  const registrazione = navigator.serviceWorker.register("sw.js").catch(err => { msg.textContent = "Service worker non disponibile: " + err.message; throw err; });
  const te = new TextEncoder();
  const daHex = h => Uint8Array.from(h.match(/.{2}/g), x => parseInt(x, 16));
  const daB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  function salva(rec) {
    return new Promise((fatto, errore) => {
      const r = indexedDB.open("centurion2-chiavi", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("chiavi");
      r.onerror = () => errore(r.error);
      r.onsuccess = () => { const db = r.result; try { const t = db.transaction("chiavi", "readwrite"); t.objectStore("chiavi").put(rec, "k"); t.oncomplete = () => { db.close(); fatto(); }; t.onerror = () => { db.close(); errore(t.error); }; } catch (err) { db.close(); errore(err); } };
    });
  }
  let tentativi = 0, occupato = false;
  f.addEventListener("submit", async e => {
    e.preventDefault(); if (occupato || !pw.value) return;
    occupato = true; b.disabled = true; msg.textContent = "Verifica in corso…";
    try {
      const meta = await (await fetch("x/meta.json", { cache: "no-cache" })).json();
      const base = await crypto.subtle.importKey("raw", te.encode(pw.value.trim()), "PBKDF2", false, ["deriveBits"]);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: daHex(meta.sale), iterations: meta.iter, hash: "SHA-256" }, base, 512));
      const enc = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-GCM" }, false, ["decrypt"]);
      const nomi = await crypto.subtle.importKey("raw", bits.slice(32, 64), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
      const c = daB64(meta.controllo);
      try { await crypto.subtle.decrypt({ name: "AES-GCM", iv: c.slice(0, 12), additionalData: te.encode("controllo") }, enc, c.slice(12)); }
      catch (err) {
        bits.fill(0); tentativi++; pw.value = ""; msg.textContent = "Password non corretta.";
        await new Promise(r => setTimeout(r, Math.min(5000, tentativi * 700))); pw.focus(); return;
      }
      msg.textContent = "Apertura…";
      try { await salva({ enc, nomi }); } catch (err) { await salva({ raw: bits.slice(0, 64).buffer }); }   // browser che non clonano le CryptoKey
      bits.fill(0); pw.value = "";
      await registrazione; const reg = await navigator.serviceWorker.ready;
      if (reg.active) reg.active.postMessage("chiavi");
      location.replace(location.pathname.replace(/index\.html$/, "") + location.hash);
    } catch (err) {
      msg.textContent = "Impossibile aprire: " + (err && err.message || err);
    } finally { occupato = false; b.disabled = false; }
  });
})();
</script>
</body>
</html>
